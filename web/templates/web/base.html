<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ATNP Database{% endblock %}</title>
    {% load static %}

    <!-- ================= CSS ================= -->

    <!-- Bootstrap -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- DataTables Bootstrap 5 -->
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ================= Global Style ================= -->
    <style>
        .custom-link {
            color: black;
            text-decoration: none;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .navbar {
            background-color: rgb(64, 158, 255) !important;
        }

        .navbar .nav-link,
        .navbar .navbar-brand,
        .navbar .navbar-toggler-icon {
            color: white !important;
        }

        .navbar-brand{
            font-size: 28px !important;
            font-weight: bold;
        }

        .navbar .nav-link:hover {
            color: #e0e0e0 !important;
        }

        .navbar-brand img {
            height: 40px;
        }

        body {
            background-color: white;
        }

        .table thead th {
            vertical-align: middle;
        }

        /* Keep SMILES text consistent with the Compound List table. */
        .smiles-text {
            font-family: inherit;
            font-size: 14px;
        }

        .container {
            margin-top: 20px;
        }

        .nav-item {
            font-size: 14px;
            line-height: 1.428571429;
            color: rgb(64, 158, 255);
        }

        .search-icon {
            margin-right: 4px;
            vertical-align: middle;
        }

        .search-bar .form-control,
        .search-bar .form-select,
        .search-bar .btn {
            border-radius: 0;
        }

        .search-bar {
            max-width: 600px;
        }

        .pagination-holder {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            margin-top: 10px;
        }

        .page_info {
            margin-right: 15px;
        }

        .page-jump-form {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-left: 0.75rem;
            white-space: nowrap;
        }

        .page-jump-input {
            width: 70px;
        }

        .btn-outline-success {
            border-color: rgb(64, 158, 255);
            color: rgb(64, 158, 255);
        }

        .btn-outline-success:hover {
            background-color: rgb(64, 158, 255);
            color: white;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

<!-- ================= Navbar ================= -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">ATNP</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'plant_list' %}">Plants List</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'compound_list' %}">Compound List</a>
                </li>
                <li class="nav-item dropdown"><a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Search</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{% url 'structure_query' %}">Structure Query</a></li>
                        <li><a class="dropdown-item" href="{% url 'molecular_weight_query' %}">Molecular Weight Query</a></li>
                        <li><a class="dropdown-item" href="{% url 'msms_search' %}">MS/MS Query</a></li>
                    </ul>
                </li>
            </ul>

            <!-- Global search -->
            <form class="d-flex" action="{% url 'search' %}" method="get">
                <input class="form-control form-control-sm me-2"
                       type="search"
                       name="q"
                       placeholder="Search">
                <button class="btn btn-light btn-sm" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ================= Page Content ================= -->
<div class="container-fluid px-4">
    {% block content %}{% endblock %}
</div>

<!-- ================= JS（顺序非常重要） ================= -->

<!-- 1️⃣ jQuery（必须最先） -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 2️⃣ Bootstrap JS -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<!-- 3️⃣ DataTables core -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<!-- 4️⃣ DataTables Bootstrap 5 -->
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<!-- DataTables page jump: displayed only when there are more than 3 pages -->
<script>
(function () {
    function addDataTablePageJump(settings) {
        const api = new $.fn.dataTable.Api(settings);
        const info = api.page.info();
        const wrapper = $(api.table().container());
        const pagination = wrapper.find('.dataTables_paginate');

        pagination.find('.datatable-page-jump').remove();

        if (info.pages <= 3) {
            return;
        }

        const jump = $(`
            <form class="page-jump-form datatable-page-jump" action="#">
                <label class="mb-0">Page</label>
                <input class="form-control form-control-sm page-jump-input"
                       type="number"
                       min="1"
                       max="${info.pages}"
                       value="${info.page + 1}"
                       aria-label="Page number">
                <span>of ${info.pages}</span>
                <button class="btn btn-sm btn-outline-primary" type="submit">Go</button>
            </form>
        `);

        jump.on('submit', function (event) {
            event.preventDefault();
            const input = jump.find('input');
            const requestedPage = Number.parseInt(input.val(), 10);

            if (Number.isNaN(requestedPage)) {
                input.trigger('focus');
                return;
            }

            const targetPage = Math.min(Math.max(requestedPage, 1), info.pages);
            api.page(targetPage - 1).draw('page');
        });

        pagination.append(jump);
    }

    $(document).on('draw.dt', function (event, settings) {
        addDataTablePageJump(settings);
    });
})();
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
