{% extends "web/base.html" %}
{% load static %}

{% block title %}Molecular Weight Results{% endblock %}

{% block content %}
<div style="font-size:20px;margin:40px 0 20px;border-bottom:2px solid #eee;">
    Molecular Weight Results
</div>

<div class="table-responsive">
    <table id="compoundTable"
           class="table w-100 table-striped table-bordered table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Compound name</th>
                <th>Database</th>
                <th>Smiles</th>
                <th>Molecular Weight</th>
                <th>Antitumor</th>
                <th>Ion mode</th>
                <th>Details</th>
            </tr>
            <tr>
                <th></th>
                <th><input class="form-control form-control-sm" placeholder="Search"></th>
                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="nist">NIST</option>
                        <option value="gnps">GNPS</option>
                        <option value="atnp">ATNP</option>
                    </select>
                </th>
                <th><input class="form-control form-control-sm" placeholder="Search"></th>
                <th></th>
                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </th>
                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="positive">Positive</option>
                        <option value="negative">Negative</option>
                    </select>
                </th>
                <th></th>
            </tr>
        </thead>
    </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(function () {

    const table = $('#compoundTable').DataTable({
        serverSide: true,
        processing: true,
        ajax: {
            url: "{% url 'mw_api' %}",
            data: function (d) {
                // ✅ 每次请求动态读取 URL（关键！！）
                const urlParams = new URLSearchParams(window.location.search);
                d.mw_min = urlParams.get("mw_min");
                d.mw_max = urlParams.get("mw_max");
            }
        },
        pageLength: 20,
        orderCellsTop: true,
        dom: 'lrtip',
        scrollX: true,
        autoWidth: false,
        columns: [
            { data: "index", orderable: false },
            { data: "standard" },
            { data: "database" },
            {
                data: "smiles",
                render: data => data
                    ? `<span class="smiles-text">${data}</span>`
                    : ""
            },
            { data: "mw" }, 
            { data: "antitumor" },
            { data: "ionmode" },
            { data: "action", orderable: false }
        ],
        stateSave: true
    });

    // ===== 列筛选 =====
    table.columns().every(function () {
        const column = this;
        const headerCell = $(column.header())
            .closest('thead')
            .find('tr:eq(1) th')
            .eq(column.index());

        const input = headerCell.find('input');
        const select = headerCell.find('select');

        if (input.length) {
            input.on('keyup', function (e) {
                if (e.key === 'Enter') {
                    column.search(this.value).draw();
                }
            });
        }

        if (select.length) {
            select.on('change', function () {
                const val = $(this).val().toLowerCase();
                column.search(val, false, false).draw();
            });
        }
    });
});
</script>
{% endblock %}
