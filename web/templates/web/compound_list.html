{% extends "web/base.html" %}
{% load static %}

{% block title %}Compound List{% endblock %}

{% block content %}

<div style="font-size:20px;margin:40px 0 20px;border-bottom:2px solid #eee;">
    Compounds
</div>

<div class="table-responsive">
    <table id="compoundTable"
           class="table w-100 table-striped table-bordered table-hover">
        <thead>
            <!-- 表头 -->
            <tr>
                <th style="width: 80px;">#</th>
                <th>Compound name</th>
                <th>Database</th>
                <th>Smiles</th>
                <th>Details</th>
            </tr>

            <!-- 搜索行 -->
            <tr>
                <th></th>
                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search compound name">
                </th>
                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="nist">NIST</option>
                        <option value="gnps">GNPS</option>
                        <option value="atnp">ATNP</option>
                    </select>
                </th>
                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search smiles">
                </th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script>
$(function () {

    const table = $('#compoundTable').DataTable({
        serverSide: true,
        processing: true,
        ajax: "{% url 'compound_list_api' %}",
        pageLength: 20,
        orderCellsTop: true,
        lengthMenu: [10, 20, 50, 100],

        searching: true,     // ✅ 必须开启
        dom: 'lrtip',        // ✅ 隐藏默认搜索框

        columns: [
            { data: "index", orderable: false },
            { data: "standard" },
            { data: "database" },
            { data: "smiles", className: "smiles-cell" },
            { data: "action", orderable: false }
        ]
    });

    // ===== 输入框：回车触发搜索 =====
    $('#compoundTable thead tr:eq(1) input').each(function (idx) {
        $(this).on('keyup', function (e) {
            if (e.key === 'Enter') {
                table
                    .column(idx + 1) // 跳过 #
                    .search(this.value)
                    .draw();
            }
        });
    });

    // ===== 下拉框：change 即搜索（database 列）=====
    $('#compoundTable thead tr:eq(1) select').on('change', function () {
        table
            .column(2)
            .search(this.value)
            .draw();
    });

});
</script>

<style>
#compoundTable tbody td.smiles-cell {
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    white-space: nowrap;
    max-width: 320px;
    overflow-x: auto;
}
</style>

<hr>
{% endblock %}
