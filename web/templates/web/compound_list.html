{% extends "web/base.html" %}
{% load static %}

{% block title %}Compound List{% endblock %}

{% block content %}

<div style="font-size:20px;margin:40px 0 20px;border-bottom:2px solid #eee;">
    Compounds
</div>

<div class="table-responsive">
    <table id="compoundTable"
           class="table w-100 table-striped table-bordered table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Compound name</th>
                <th>Database</th>
                <th>Smiles</th>
                <th>Antitumor</th>
                <th>Ion mode</th>
                <th>Details</th>
            </tr>

            <tr>
                <th></th>

                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search compound name">
                </th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="nist">NIST</option>
                        <option value="gnps">GNPS</option>
                        <option value="atnp">ATNP</option>
                    </select>
                </th>

                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search smiles">
                </th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="positive">Positive</option>
                        <option value="negative">Negative</option>
                    </select>
                </th>

                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script>
$(function () {

    const table = $('#compoundTable').DataTable({
        serverSide: true,
        processing: true,
        stateSave: true,
        stateDuration: -1,
        ajax: "{% url 'compound_list_api' %}",
        pageLength: 20,
        orderCellsTop: true,
        dom: 'lrtip',
        columns: [
            {
                data: "index",
                orderable: false,
                width: "60px"
            },
            {
                data: "standard",
                width: "260px",
                render: data => data
                    ? `<span title="${data}">${data}</span>`
                    : ""
            },
            {
                data: "database",
                width: "90px"
            },
            {
                data: "smiles",
                width: "320px",
                render: data => data
                    ? `<span title="${data}">${data}</span>`
                    : ""
            },
            {
                data: "antitumor",
                width: "90px"
            },
            {
                data: "ionmode",
                width: "110px"
            },
            {
                data: "action",
                orderable: false,
                width: "100px"
            }
        ],

        initComplete: function () {
            const api = this.api();

            api.columns().every(function () {
                const column = this;

                const headerCell = $(column.header())
                    .closest('thead')
                    .find('tr:eq(1) th')
                    .eq(column.index());

                const currentSearch = column.search();

                const select = headerCell.find('select');
                if (select.length) {
                    if (currentSearch) {
                        select.val(currentSearch);
                    }

                    select.off('change').on('change', function () {
                        const val = ($(this).val() || '').toLowerCase();

                        if (column.search() !== val) {
                            column.search(val, false, false).draw();
                        }
                    });
                }

                const input = headerCell.find('input');
                if (input.length) {
                    if (currentSearch) {
                        input.val(currentSearch);
                    }

                    input.off('keyup').on('keyup', function (e) {
                        if (e.key === 'Enter') {
                            if (column.search() !== this.value) {
                                column.search(this.value).draw();
                            }
                        }
                    });
                }
            });
        }
    });

});
</script>

<style>
/* 字体 */
#compoundTable tbody td {
    font-size: 14px;
}

/* Compound name 列折叠 */
#compoundTable td:nth-child(2) {
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* SMILES 列折叠 */
#compoundTable td:nth-child(4) {
    max-width: 320px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 其他列紧凑 */
#compoundTable td:nth-child(1),
#compoundTable td:nth-child(3),
#compoundTable td:nth-child(5),
#compoundTable td:nth-child(6),
#compoundTable td:nth-child(7) {
    white-space: nowrap;
}

/* 表头不换行 */
#compoundTable th {
    white-space: nowrap;
}
</style>

{% endblock %}
