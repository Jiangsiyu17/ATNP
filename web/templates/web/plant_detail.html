{% extends "web/base.html" %}
{% load static %}

{% block title %}{{ latin_name }} - Related Compounds{% endblock %}

{% block content %}

<div style="font-size:20px;margin:40px 0 20px;border-bottom:2px solid #eee;">
    Compounds related to "{{ latin_name }}"
</div>

<div class="table-responsive">
    <table id="plantTable"
           class="table w-100 table-striped table-bordered table-hover">

        <thead>
            <tr>
                <th>#</th>
                <th>Compound name</th>
                <th>Precursor m/z</th>
                <th>Database</th>
                <th>Smiles</th>
                <th>Antitumor</th>
                <th>Ion mode</th>
                <th>Details</th>
            </tr>

            <tr>
                <th></th>

                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search compound name">
                </th>

                <th></th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="nist">NIST</option>
                        <option value="gnps">GNPS</option>
                        <option value="atnp">ATNP</option>
                    </select>
                </th>

                <th>
                    <input class="form-control form-control-sm"
                           placeholder="Search smiles">
                </th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </th>

                <th>
                    <select class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="positive">Positive</option>
                        <option value="negative">Negative</option>
                    </select>
                </th>

                <th></th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>
</div>

{% endblock %}


{% block extra_js %}
<script>
$(function () {

    const table = $('#plantTable').DataTable({
        serverSide: true,
        processing: true,
        stateSave: true,
        stateDuration: -1,
        ajax: "/api/plant/{{ latin_name }}/",
        pageLength: 20,
        orderCellsTop: true,
        dom: 'lrtip',
        autoWidth: false,
        scrollX: true,

        columns: [
            {
                data: "index",
                orderable: false,
                width: "60px"
            },
            {
                data: "standard",
                width: "260px",
                render: function (data) {
                    return data
                        ? `<span title="${data}">${data}</span>`
                        : "";
                }
            },
            {
                data: "precursor_mz",
                width: "120px"
            },
            {
                data: "database",
                width: "90px"
            },
            {
                data: "smiles",
                width: "320px",
                render: function (data) {
                    return data
                        ? `<span class="smiles-text" title="${data}">${data}</span>`
                        : "";
                }
            },
            {
                data: "antitumor",
                width: "90px"
            },
            {
                data: "ionmode",
                width: "110px"
            },
            {
                data: "action",
                orderable: false,
                width: "100px"
            }
        ],

        initComplete: function () {
            const api = this.api();

            api.columns().every(function () {
                const column = this;

                const headerCell = $(column.header())
                    .closest('thead')
                    .find('tr:eq(1) th')
                    .eq(column.index());

                const currentSearch = column.search();

                const input = headerCell.find('input');
                const select = headerCell.find('select');

                // ======================
                // INPUT
                // ======================
                if (input.length) {
                    if (currentSearch) {
                        input.val(currentSearch);
                    }

                    input.off('keyup').on('keyup', function (e) {
                        if (e.key === 'Enter') {
                            if (column.search() !== this.value) {
                                column.search(this.value).draw();
                            }
                        }
                    });
                }

                // ======================
                // SELECT
                // ======================
                if (select.length) {
                    if (currentSearch) {
                        select.val(currentSearch);
                    }

                    select.off('change').on('change', function () {
                        const val = ($(this).val() || '').toLowerCase();

                        if (column.search() !== val) {
                            column.search(val, false, false).draw();
                        }
                    });
                }

            });
        }
    });

});
</script>


<style>
/* =========================
   Table Base Style
========================= */

#plantTable tbody td {
    font-size: 14px;
}

/* =========================
   Column width + truncate
========================= */

#plantTable td:nth-child(2) {
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#plantTable td:nth-child(5) {
    max-width: 320px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* keep numeric / short columns clean */
#plantTable td:nth-child(1),
#plantTable td:nth-child(3),
#plantTable td:nth-child(4),
#plantTable td:nth-child(6),
#plantTable td:nth-child(7),
#plantTable td:nth-child(8) {
    white-space: nowrap;
}

/* header no wrap */
#plantTable th {
    white-space: nowrap;
}
</style>

{% endblock %}
